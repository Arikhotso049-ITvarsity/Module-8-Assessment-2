<!DOCTYPE html>
<html>
<head>
    <title>My Recipe Book | Meals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fontawesome/css/all.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="body-meals">
    <div class="header">
        <a href="index.html">
            <i class="fas fa-arrow-left"></i>
        </a>
        <img src="images/logo-text.png">
    </div>
    <div id="meals">
        <div class="meals-list" id="output">


        </div>
    </div>

    <script>
    var category = getCategory();

    function getRecipeList() {
        var rootPath = "https://mysite.itvarsity.org/api/recipe-book/";
        var fullPath = rootPath + "get-recipes/?category=" + encodeURIComponent(category);

        fetch(fullPath)
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                var output = "";

                for (var a = 0; a < data.length; a++) {
                    output += `
                        <a href="show-recipe.html?id=${data[a].id}">
                            <div class="meals-list-item">
                                <h1>${data[a].title}<i class="fa fa-chevron-circle-right"></i></h1>
                                <p>${data[a].description}</p>
                            </div>
                        </a>
                    `;
                }

                document.getElementById("output").innerHTML = output;
            })
            .catch(function(error) {
                console.log(error);
                document.getElementById("output").innerHTML =
                    "Unable to load recipes. Please try again.";
            });
    }

    function getCategory() {
        var url = window.location.href;
        var pos = url.search("=");

        if (pos === -1) {
            return "";
        }

        var category = url.slice(pos + 1);

        return decodeURIComponent(category);
    }

    getRecipeList();
</script>
</body>
</html>
